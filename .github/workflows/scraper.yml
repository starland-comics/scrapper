name: WinStars Scraper

on:
  schedule:
    - cron: '*/5 * * * *'   # Каждые 5 минут
  workflow_dispatch:         # Кнопка ручного запуска

concurrency:
  group: scraper
  cancel-in-progress: false  # Не убиваем текущий, ждём завершения

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -u scraper.py