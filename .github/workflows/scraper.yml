name: WinStars Scraper

on:
  schedule:
    - cron: '*/5 * * * *'   # Каждые 5 минут
  workflow_dispatch:         # Кнопка ручного запуска

concurrency:
  group: scraper
  cancel-in-progress: false  # Не убиваем текущий, ждём завершения

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache rebrowser-playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: rebrowser-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install rebrowser system deps
        run: rebrowser_playwright install-deps chromium

      - name: Install rebrowser Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: rebrowser_playwright install chromium

      - name: Run Scraper
        env:
          DO_RECON: '1'   # 👈 ОДИН РАЗ поставь '1' для разведки, потом поменяй на '0'
        run: python -u scraper.py