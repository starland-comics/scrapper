name: WinStars Scraper

on:
  schedule:
    - cron: '*/10 * * * *'   # каждые 10 минут, чтобы не палить Flashscore
  workflow_dispatch:

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache rebrowser-playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: rebrowser-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install rebrowser system deps
        run: rebrowser_playwright install-deps chromium

      - name: Install rebrowser Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: rebrowser_playwright install chromium

      - name: Run Scraper
        run: python -u scraper.py